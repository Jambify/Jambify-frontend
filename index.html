<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/JAMBIFY.LOGO.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>JAMBIFY</title>

    <!-- Google Fonts: load here so they are available before first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800,900 &family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/index.css" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("jambify-theme");
          var supportDarkMode =
            window.matchMedia("(prefers-color-scheme: dark)").matches === true;
          if (!theme && supportDarkMode) theme = "dark";
          if (!theme && !supportDarkMode) theme = "light";

          if (theme === "light") {
            document.documentElement.setAttribute("data-theme", "light");
            document.body.style.backgroundColor = "#f5f8ff";
          } else {
            document.documentElement.removeAttribute("data-theme");
            document.body.style.backgroundColor = "#0a0a0f";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="background-color: #0a0a0f; margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
